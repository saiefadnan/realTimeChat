<div class="room-container">
    <div id="room-sidebar-container" class="active-container">
        <h5 id="list-header" style="font-weight:bold;font-size:small;padding:0 20px;">Rooms</h5>
        <div id="room-list"></div>
    </div>

    <div id="room-chat-wrapper" class="chat-main-area">
        <div class="room-controls-header">
            <legend id="current-room" class="room-title-label"></legend>
            <div class="room-action-buttons">
                <a class="waves-effect waves-light btn modal-trigger" href="#room-creation-modal" title="Create Room"><i class="material-icons">add</i></a>
                <a class="waves-effect waves-light btn modal-trigger" href="#search-modal" title="Add Homies"><i class="material-icons">group_add</i></a>
                <button id="video-call-btn" class="waves-effect waves-light btn blue" title="Video Call">
                    <i class="material-icons">videocam</i>
                </button>
            </div>
        </div>
        
        <div id="chat-content" class="chat-content"></div>
        
        <div class="chat-footer">
            <textarea id="message-input" class="message-input" rows="1" placeholder="Type your message...."></textarea>
            <button id="send-button"><i class="fas fa-paper-plane send-icon"></i></button>
            <button id="chat-more-button" class="custom-file-upload chat-more-button" type="button" title="More actions" aria-label="More actions" aria-expanded="false">
                <i class="fas fa-ellipsis-h"></i>
            </button>
            <label for="file-input" class="file-label" title="Upload GIF, image, video, or file">
                <div class="custom-file-upload" id="custom-file-upload">
                    <i class="fas fa-photo-video upload-icon"></i>
                </div>
                <input type="file" id="file-input" class="file-input" placeholder="file" accept="image/gif,image/*,video/*,*/*" style="display: none;">
            </label>
            <button id="mood-btn" class="custom-file-upload" title="Set Vibe"><i class="fas fa-smile"></i></button>
        </div>
    </div>
</div>

  <div id="video-modal">
    <div class="input-field" style="display: flex;justify-content: flex-end;">
      <button id="exit-video" class="btn red" type="button">
        <i class="material-icons">call_end</i>
      </button>
    </div>
    <div class="modal-content" id="video-modal-content">
      <video id="localVideo" class="video-modal-child" autoplay playsinline muted ></video>
      <!-- <video id="remoteVideo" class="video-modal-child" autoplay playsinline muted ></video>
      <video class="video-modal-child" autoplay playsinline muted style="background-color: green;"></video>
      <video class="video-modal-child" autoplay playsinline muted style="background-color: green;"></video>
      <video  class="video-modal-child" autoplay playsinline muted style="background-color: green;"></video>
      <video  class="video-modal-child" autoplay playsinline muted style="background-color: green;"></video> -->
    </div>
  </div>

  <div id="search-modal" class="modal">
      <div class="modal-content">
        <h4>Search & add Homies</h4>
        <form>
          <div class="input-field">
        <input id="search" type="text" class="validate" required>
        <label for="search">Search Users</label>
      </div>
          <div id="item-list">
          </div>
          <div class="input-field" style="display: flex;justify-content: center;">
            <button id="invite-user" class="waves-effect waves-light btn" type="submit">Invite</button>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <a href="#!" style="border: 1px solid #ddd;" class="modal-close waves-effect waves-green btn-flat">Close</a>
      </div>
    </div>


    <div id="room-creation-modal" class="modal">
      <div class="modal-content">
        <h4>Room Creation</h4>
        <form>
          <div class="input-field">
            <input id="room-name" type="text" class="validate" required>
            <label for="room-name">Room Name</label>
          </div>
        </form>
      </div>
      <div class="input-field" style="display: flex;justify-content: center;">
        <button id="create-room" class="waves-effect waves-light btn" type="submit">Create Room</button>
      </div>
      <div class="modal-footer">
        <a href="#!" style="border: 1px solid #ddd;" class="modal-close waves-effect waves-green btn-flat">Close</a>
      </div>
    </div>
</div>
