<div class="chat-container">
    <div id="active-container" class="active-container">
        <h5 id="list-header" style="font-weight:bold;font-size:small">Active Homies</h5> 
        <div id="active">
        </div>
    </div>
    <div id="chat-container">
        <input type="text" id="recipientInput" disabled="true" placeholder="Recipient username">
        <div id="chat-content" class="chat-content"></div>
        <div class="chat-footer">
            <textarea id="message-input" class="message-input" rows="4" cols="15" placeholder="Type your message...."></textarea>
            <button id="send-button"><i class="fas fa-paper-plane send-icon"></i></button>
            <button id="chat-more-button" class="custom-file-upload chat-more-button" type="button" title="More actions" aria-label="More actions" aria-expanded="false">
                <i class="fas fa-ellipsis-h"></i>
            </button>
            <label for="file-input" class="file-label" title="Upload GIF, image, video, or file">
                <div class="custom-file-upload" id="custom-file-upload">
                    <i class="fas fa-photo-video upload-icon"></i>
                </div>
                <input type="file" id="file-input" class="file-input" placeholder="file" accept="image/gif,image/*,video/*,*/*" style="display: none;">
            </label>
            <button id="mood-btn" class="custom-file-upload" title="Set Vibe"><i class="fas fa-smile"></i></button>
        </div>
    </div>
</div>

<!-- Mood Picker Modal -->
<div id="mood-modal" class="modal">
    <div class="modal-content">
        <h5 style="margin-top:0">Set Your Vibe</h5>
        <div class="mood-picker">
            <span class="mood-option" data-mood="😎">😎</span>
            <span class="mood-option" data-mood="🚀">🚀</span>
            <span class="mood-option" data-mood="🔥">🔥</span>
            <span class="mood-option" data-mood="😴">😴</span>
            <span class="mood-option" data-mood="🎮">🎮</span>
            <span class="mood-option" data-mood="💻">💻</span>
            <span class="mood-option" data-mood="✨">✨</span>
            <span class="mood-option" data-mood="🍕">🍕</span>
            <span class="mood-option" data-mood="🌈">🌈</span>
            <span class="mood-option" data-mood="⚡">⚡</span>
        </div>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-close btn-flat">Cancel</a>
    </div>
</div>
