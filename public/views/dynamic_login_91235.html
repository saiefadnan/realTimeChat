<div class="auth-wrapper">

    <div id="box">
        <h4 class="center-align auth-header">Login</h4>
        <div class="row">
            <form class="col s12">
                <div class="input-field col s12">
                    <input id="email" type="email" class="validate">
                    <label for="email">Email</label>
                </div>
                <div class="input-field col s12">
                    <input id="password" type="password" class="validate">
                    <label for="password">Password</label>
                </div>
                <div class="input-field col s12 center-align">
                    <button id="login-button" class="btn waves-effect waves-light" type="submit">
                        Login <i class="material-icons right">login</i>
                    </button> 
                </div>
                <div id="error-box" class="input-field col s12 red-text center-align" style="display: none;"></div>
            </form>
        </div>
    </div>
</div>
