<img src="https://ugokawaii.com/wp-content/uploads/2023/06/conversation.gif" class="background-gif"/>
<div class="auth-wrapper">

    <div id="box">
        <h4 class="center-align auth-header">Signup</h4>
        
        <div class="zoom-pic-container center-align" style="margin-bottom: 20px;">
            <input type="file" id="profile-pic" accept="image/*" class="image-input" style="display: none;">
            <label for="profile-pic">
                <div id="profile-container" class="profile-container" style="margin: auto; cursor: pointer;">
                    <img src="https://gifdb.com/images/high/eren-yeager-blowing-hair-o63aaatimhxaojbu.gif" alt="Profile Picture" class="responsive-img circle" style="width: 80px; height: 80px; object-fit: cover; border: 2px solid var(--accent);" />
                </div>
            </label>
            <p style="font-size: 10px; color: var(--text-muted);">Click to upload avatar</p>
        </div>

        <div class="row">
            <form id="signup-form" class="col s12">
                <div class="input-field col s12">
                    <input id="email" type="email" class="validate" autocomplete="email">
                    <label for="email">Email</label>
                </div>
                <div class="input-field col s12">
                    <input id="username" type="text" class="validate" autocomplete="username">
                    <label for="username">Username</label>
                </div>            
                <div class="input-field col s12">
                    <input
                        id="password"
                        type="password"
                        class="validate"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >
                    <label for="password">Password</label>
                </div>
                <div class="input-field col s12 center-align">
                    <button id="signup-button" class="btn waves-effect waves-light" type="submit">
                        Join Now <i class="material-icons right">person_add</i>
                    </button>
                </div>
                <div id="error-box" class="input-field col s12 red-text center-align" style="display: none;"></div>
            </form>
        </div>
    </div>
</div>
