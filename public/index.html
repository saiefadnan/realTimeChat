<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat-chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20220527/ourmid/pngtree-chat-box-icon-web-white-png-image_4756254.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/botui/build/botui.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/botui/build/botui-theme-default.css">

</head>
<body>
<nav>
    <div class="nav-wrapper">
        <a href="#" class="brand-logo">Chit-chat</a>
        <a href="#" data-target="mobile-demo" class="sidenav-trigger" onclick="toggleColor(window.currentLocation)"><i class="material-icons">menu</i></a>

            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li onclick="window.loadPage('chat.html', 'chat')" class="nav-chat" style="cursor: pointer;"><a href="#" id="chat" data-page="chat" class="tab">Chat</a></li>
                <li onclick="window.loadPage('room.html', 'room')" class="nav-room" style="cursor: pointer;"><a href="#" id="room" data-page="room" class="tab">Room</a></li>
                <li onclick="window.loadPage('signup.html', 'signup')" class="nav-signup" style="cursor: pointer;"><a href="#" id="signup" data-page="signup" class="tab">Signup</a></li>
                <li onclick="window.loadPage('login.html', 'login')" class="nav-login" style="cursor: pointer;"><a href="#" id="login" data-page="login" class="tab">Login</a></li>
                <li onclick="handleLogout()"
                    class="nav-logout"
                    style="cursor: pointer;">
                    <a href="#" id="logout" class="tab">Logout</a>
                </li>
                <img class="circle responsive-img nav-profile-img" id="nav-profile1" src="https://gifdb.com/images/high/eren-yeager-blowing-hair-o63aaatimhxaojbu.gif" alt="Profile" />
            </ul>
    </div>
</nav>
<ul class="sidenav" id="mobile-demo">
    <div class="sidenav-profile-wrap">
        <img class="circle responsive-img" id="nav-profile2" src="https://gifdb.com/images/high/eren-yeager-blowing-hair-o63aaatimhxaojbu.gif" alt="Profile" />
    </div>
    <li onclick="window.loadPage('chat.html', 'chat')"  class="nav-chat"><a  href="#" id="chat" class="tab">Chat</a></li>
    <li onclick="window.loadPage('room.html', 'room')" class="nav-room"><a  href="#" id="room" class="tab">Room</a></li>
    <li onclick="window.loadPage('signup.html', 'signup')" class="nav-signup"><a  href="#" id="signup" class="tab">Signup</a></li>
    <li onclick="window.loadPage('login.html', 'login')" class="nav-login"><a  href="#" id="login" class="tab">Login</a></li>
    <li onclick="handleLogout()" class="nav-logout"><a href="#" class="tab">Logout</a></li>
</ul>

<div id="page">
    
</div>  
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script src="https://cdn.jsdelivr.net/npm/botui/build/botui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simplewebrtc@latest/simplewebrtc.bundle.js"></script>
<script src="chatMediaPreview.js"></script>

<script type="module">
    import { loadPage, toggleColor, handleLogout, updateUploadProgress } from './loadfunc.js'; 
    import fetchData from './fetchData.js';
    import { Pending, clearPending }from './pending.js';
    import  setUserInfo from './userInfo.obf.js';
    window.currentLocation = "chat"
    window.handleLogout = handleLogout;
    window.loadPage = loadPage;
    window.toggleColor = toggleColor;
    window.updateUploadProgress = updateUploadProgress;
    window.fetchData = fetchData;
    window.Pending = Pending;
    window.clearPending = clearPending;
    window.setUserInfo = setUserInfo;
    window.eventListeners = [];
    window.rooms = [];
    window.userInfo = {
        status:false,
        username: null,
        imageurl: null
    }
    window.pending ={
        status:false,
        recipient: null,
        content: null,
        offset: 0
    }
</script>
<script type="module" src="loadComp.js"></script>
</body>
</html>
